services:
  metube:
    image: ghcr.io/alexta69/metube
    container_name: metube
    restart: unless-stopped
    ports:
      - "8082:8081"
    volumes:
      - ./downloads:/downloads
      - ./config:/config:ro
      - ./plugins:/plugins:ro
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - DEFAULT_THEME=dark
      - MAX_CONCURRENT_DOWNLOADS=2
      - CUSTOM_DIRS=true
      - CREATE_CUSTOM_DIRS=true
      - YTDL_OPTIONS_FILE=/config/ytdl-options.json
      - YTDL_OPTIONS_PRESETS_FILE=/config/ytdl-options-presets.json
      - PYTHONPATH=/plugins
    user: "1000:1000"
